<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fragebogen">
  <title>Achilles Altona — Fragebogen verschicken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Fragebogen verschicken</h1>
      <p class="app__subtitle">Achilles Altona</p>
    </header>

    <section class="app__mail">
      <label for="email">Mailadresse der Patient:in</label>
      <input
        id="email"
        type="email"
        inputmode="email"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="name@beispiel.de">
    </section>

    <section class="app__grid" id="grid"></section>
  </main>

  <div class="dialog" id="dialog" hidden>
    <div class="dialog__card">
      <p class="dialog__text" id="dialog-text"></p>
      <div class="dialog__buttons">
        <button type="button" class="btn btn--secondary" id="dialog-cancel">Abbrechen</button>
        <button type="button" class="btn btn--primary" id="dialog-confirm">Senden</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
